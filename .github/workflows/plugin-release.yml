name: 发布 Velocity 插件

on:
  push:
    tags: ['plugin-v*']
  workflow_dispatch:
    inputs:
      version:
        description: '插件版本，例如 0.1.1'
        required: true
        default: '0.1.0'

permissions:
  contents: write

jobs:
  release:
    name: 构建并发布插件包
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: 解析版本
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#plugin-v}"
          else
            version="${{ inputs.version }}"
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: 构建插件
        working-directory: jump-plugin
        run: ./gradlew clean test shadowJar -PpluginVersion=${{ steps.version.outputs.version }}

      - name: 发布 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: plugin-v${{ steps.version.outputs.version }}
          name: 联动猫猫跳转插件 v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: jump-plugin/build/libs/liandong-maomao-jump-plugin-${{ steps.version.outputs.version }}.jar
