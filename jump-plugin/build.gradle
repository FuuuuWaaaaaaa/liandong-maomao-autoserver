plugins {
    id 'java'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

group = 'cn.liandongmaomao'
version = providers.gradleProperty('pluginVersion').orElse('0.1.0').get()

repositories {
    mavenCentral()
    maven { url = uri('https://repo.papermc.io/repository/maven-public/') }
}

dependencies {
    compileOnly 'com.velocitypowered:velocity-api:3.4.0'
    implementation 'com.google.code.gson:gson:2.11.0'
    implementation 'org.yaml:snakeyaml:2.3'
    annotationProcessor 'com.velocitypowered:velocity-api:3.4.0'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
}

java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.named('test') { useJUnitPlatform() }
tasks.named('shadowJar') { archiveClassifier = '' }

def pluginVersion = project.version.toString()
def generatedVersionDir = layout.buildDirectory.dir('generated/sources/pluginVersion')
sourceSets.main.java.srcDir(generatedVersionDir)
tasks.register('generatePluginVersion') {
    outputs.dir(generatedVersionDir)
    doLast {
        def versionFile = generatedVersionDir.get().file('cn/liandongmaomao/jump/PluginVersion.java').asFile
        versionFile.parentFile.mkdirs()
        versionFile.text = "package cn.liandongmaomao.jump; public final class PluginVersion { public static final String VALUE = \"${pluginVersion}\"; private PluginVersion() {} }"
    }
}
tasks.named('compileJava') { dependsOn('generatePluginVersion') }
processResources {
    filesMatching('velocity-plugin.json') { expand(version: pluginVersion) }
}
